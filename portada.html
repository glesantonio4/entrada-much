<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#7d2184">
  <title>MUCH · Portada</title>
  <style>
    :root{
      --bg1:#23272f; 
      --bg2:#a636d5; 
      --white:#ffffff;

      /* Colores del MUCH */
      --fucsia:#cb2fc0;
      --morado:#aa36dc;
      --turquesa:#00bcd4;
      --amarillo:#dbca31;
      --verde:#8bc34a;

      --card-bg1:rgba(123, 31, 162, 0.55); 
      --card-bg2:rgba(233, 30, 99, 0.35);
      --card-br:24px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      min-height:100svh;
      display:grid; place-items:center;
      background: radial-gradient(1200px 600px at 10% 0%, var(--bg1), transparent),
                  linear-gradient(180deg, var(--bg1), var(--bg2));
      padding:
        max(12px, env(safe-area-inset-top))
        max(12px, env(safe-area-inset-right))
        max(16px, env(safe-area-inset-bottom))
        max(12px, env(safe-area-inset-left));
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
     .card{
    width:min(920px, 94vw);
    border-radius:var(--card-br);
    background:linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.06));
    border:1px solid rgba(255,255,255,.45);
    box-shadow:0 30px 80px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.2);
    padding:clamp(16px, 5vw, 32px);
    text-align:center; color:var(--white);
    backdrop-filter: blur(6px);
    position:relative;
  }

  /* ===== LOGOS (base) ===== */
 .logo-esquina{
  position:absolute;
  /* tamaño base (si no se sobreescribe) */
  --logo-h: clamp(56px, 12vw, 84px);
  /* cuánto se levantan respecto a su propio alto */
  --raise: 1.25;                 /* <- súbelo si quieres mayor separación global */
  height: var(--logo-h);
  width:auto;
  top: calc(-1 * var(--raise) * var(--logo-h));  /* sube proporcional */
  border-radius:12px;
  background:#fff;
  padding:8px 12px;
  box-shadow:0 6px 14px rgba(0,0,0,.25);
}

/* IZQUIERDO: tamaño fijo 43px y un poco más arriba */
.logo-izq-abs{
  left:20px;
  --logo-h: 45px;    /* tamaño que pediste */
  --raise: 1.40;     /* súbelo sin tocar el derecho */
}

/* DERECHO: tamaño fijo 44px y mismo margen superior */
.logo-der-abs{
  right:20px;
  --logo-h: 45px;    /* tamaño que pediste */
  --raise: 1.40;     /* igual separación que el izquierdo */
  background:#f6f6f6;
}

  
  /* Logo MUCH */
  .logo-much{
    display:block; margin:0 auto clamp(16px, 4vw, 24px);
    height:100px; width:auto; filter: drop-shadow(0 4px 10px rgba(0,0,0,.25));
  }

  h1{ font-size: clamp(25px, 7vw, 50px); line-height:1.05; font-weight:900; letter-spacing:.6px;
      text-shadow:0 2px 8px rgba(0,0,0,.35); margin: 6px 0 10px; }
  .sub{ font-size:clamp(14px, 3.8vw, 20px); opacity:.95; margin-bottom:clamp(12px, 4vw, 18px) }

  .btn{
    appearance:none; border:0; cursor:pointer; display:inline-block; text-decoration:none;
    padding:clamp(12px, 3.8vw, 16px) clamp(18px, 6vw, 22px);
    border-radius:16px; font-weight:900; font-size:clamp(16px, 4vw, 20px); color:#fff;
    background:linear-gradient(135deg,#f72585,#7209b7);
    box-shadow:0 18px 44px rgba(155,92,249,.35),0 6px 16px rgba(0,0,0,.25);
    min-width:200px; min-height:48px;
  }
  .btn.disabled {
    background: #555;
    pointer-events: none;
    cursor: not-allowed;
  }
  .tip{margin-top:clamp(10px, 3vw, 14px); font-size:clamp(12px, 3.4vw, 14px); opacity:.9}
  #mensajeAgotado {
    display: none;
    color: #ffc107;
    font-weight: bold;
    margin-top: 1rem;
  }
</style>
</head>
<body>
  <main class="card">
    <img src="Logo-Ag-14.png" alt="Logo Aditech" class="logo-esquina logo-izq-abs">
    <img src="logo-sata.png" alt="Logo SATA" class="logo-esquina logo-der-abs">

    <img src="logo-much.png" alt="Logo MUCH" class="logo-much">

    <h1>MUCH</h1>
    <p class="sub">Aprende y gana premios!! 🎁</p>

    <a id="playBtn" class="btn" href="index.html?from=portada">🚀 Jugar ahora</a>
    <div id="mensajeAgotado"></div>
    <p class="tip">Tip: Lee cuidadosamente las preguntas 🦖</p>
  </main>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = 'https://qwgaeorsymfispmtsbut.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3Z2Flb3JzeW1maXNwbXRzYnV0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIzODcyODUsImV4cCI6MjA3Nzk2MzI4NX0.FThZIIpz3daC9u8QaKyRTpxUeW0v4QHs5sHX2s1U1eo';
    const SUPABASE_PUBLIC_OPTIONS = {
      auth: {
        persistSession: false,
        autoRefreshToken: false,
        detectSessionInUrl: false
      }
    };
    const DAILY_TICKET_LIMIT = 50;
    const NUM_QUESTIONS = 6;
    const qs = new URLSearchParams(window.location.search);
    const salaSlug = (qs.get('sala') || 'entrada').toLowerCase();
    const SALA_MAP = {
      energia: '08a6cc96-5323-42e0-89df-77a8c36e9705',
      spinosaurio: '0b4f04b0-5196-473d-8689-55d5f315df55',
      desarrollo_sustentable: '17fd001d-f6c5-4f98-ab25-d81624227bc2',
      biodiversidad: '4bdffb5f-1a55-4952-be0c-9d487550fb0c',
      entrada: '6d66b495-cf43-42c1-b7f8-627ceb6fe33d'
    };
    const currentSalaId = SALA_MAP[salaSlug] || SALA_MAP.entrada;
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_PUBLIC_OPTIONS);

    async function verificarDisponibilidad() {
      const playBtn = document.getElementById('playBtn');
      if (playBtn) {
        const extraParams = window.location.search ? `&${window.location.search.slice(1)}` : '';
        playBtn.href = `index.html?from=portada${extraParams}`;
      }

      // 1. Definir el rango de hoy
      const hoy = new Date();
      const offsetMexico = hoy.getTimezoneOffset() * 60000;
      const localTime = new Date(hoy.getTime() - offsetMexico);
      const fechaHoyStr = localTime.toISOString().split('T')[0];
      const inicioDelDia = `${fechaHoyStr}T00:00:00.000Z`;
      const finDelDia = `${fechaHoyStr}T23:59:59.999Z`;

      // 2. Consulta a Supabase
      try {
        const { count, error } = await supabase
          .from('quizzes')
          .select('*', { count: 'exact', head: true })
          .eq('sala_id', currentSalaId)
          .gte('finished_at', inicioDelDia)
          .lte('finished_at', finDelDia)
          .eq('num_correctas', NUM_QUESTIONS);

        if (error) {
          console.error('Error al verificar boletos:', error.message);
          return;
        }

        // 3. Acción en el UI
        const playBtn = document.getElementById('playBtn');
        const mensajeAgotado = document.getElementById('mensajeAgotado');

        if (count >= DAILY_TICKET_LIMIT) {
          if (playBtn) {
            playBtn.style.display = 'none';
          }
          if (mensajeAgotado) {
            mensajeAgotado.style.display = 'block';
            mensajeAgotado.textContent = 'Gracias por participar, pero los boletos de hoy están agotados, vuelve mañana.';
          }
          console.warn('Boletos diarios agotados. Límite: 10.');
        } else {
          console.log(`Boletos disponibles: ${DAILY_TICKET_LIMIT - count}`);
           if (playBtn) {
            playBtn.style.display = 'block';
          }
          if (mensajeAgotado) {
            mensajeAgotado.style.display = 'none';
          }
        }

      } catch (e) {
        console.error('Excepción al contar boletos:', e);
      }
    }

    document.addEventListener('DOMContentLoaded', verificarDisponibilidad);
  </script>
</body>
</html>
