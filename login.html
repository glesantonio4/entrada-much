<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <title>MUCH • Inicio de Sesión</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg-body: #050a18;
      --bg-card: #0f172a;
      --border: rgba(255, 255, 255, 0.08);
      --accent: #06b6d4;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: var(--bg-body);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
      justify-content: center;
    }

    .brand-logo {
      width: 44px;
      height: 44px;
      background: white;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .brand-txt h1 {
      font-size: 20px;
      margin: 0;
      font-weight: 800;
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .header h2 {
      font-size: 24px;
      margin: 0;
      font-weight: 700;
    }

    .header p {
      color: var(--text-muted);
      margin: 8px 0 0;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    input {
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      color: white;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(6, 182, 212, 0.1);
    }

    .btn-login {
      width: 100%;
      background: var(--accent);
      color: #000;
      border: 0;
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 12px;
      transition: 0.2s;
    }

    .btn-login:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn-login:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    #error-msg {
      color: #ef4444;
      font-size: 13px;
      text-align: center;
      margin-top: 16px;
      background: rgba(239, 68, 68, 0.1);
      padding: 10px;
      border-radius: 8px;
      display: none;
    }
  </style>
</head>

<body>
  <div class="login-card">
    <div class="brand">
      <div class="brand-logo">🦖</div>
      <div class="brand-txt">
        <h1>MUCH</h1>
      </div>
    </div>

    <div class="header">
      <h2>Bienvenido</h2>
      <p>Ingresa tus credenciales para acceder</p>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" placeholder="admin@much.mx" required>
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" id="btn-submit" class="btn-login">Iniciar Sesión</button>
      <div id="error-msg"></div>
    </form>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = 'https://qwgaeorsymfispmtsbut.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3Z2Flb3JzeW1maXNwbXRzYnV0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIzODcyODUsImV4cCI6MjA3Nzk2MzI4NX0.FThZIIpz3daC9u8QaKyRTpxUeW0v4QHs5sHX2s1U1eo';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById('login-form');
    const btnSubmit = document.getElementById('btn-submit');
    const errorMsg = document.getElementById('error-msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btnSubmit.disabled = true;
      errorMsg.style.display = 'none';

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email,
          password
        });

        if (error) throw error;

        // Éxito: redireccionar al dashboard
        window.location.href = 'dashboard.html';
      } catch (err) {
        errorMsg.textContent = "Error: " + (err.message === 'Invalid login credentials' ? 'Credenciales inválidas' : err.message);
        errorMsg.style.display = 'block';
        btnSubmit.disabled = false;
      }
    });

    // Verificar si ya tiene sesión
    (async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) window.location.href = 'dashboard.html';
    })();
  </script>
</body>

</html>
